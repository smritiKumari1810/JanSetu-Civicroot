<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A56DB" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Orange Spark Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#glow)" />

  <!-- JanSetu Bridge / Digital Foundation Arch -->
  <path d="M14 44 C 14 30, 50 30, 50 44" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  
  <!-- Civic Pillars -->
  <line x1="22" y1="36" x2="22" y2="44" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="32" y1="33" x2="32" y2="44" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="42" y1="36" x2="42" y2="44" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Shield / Root Node Core -->
  <path d="M32 14 L46 20 C46 32, 32 40, 32 40 C32 40, 18 32, 18 20 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />

  <!-- AI Sparkle Core (Center) -->
  <path d="M32 20 L33.8 25.5 L39 27 L33.8 28.5 L32 34 L30.2 28.5 L25 27 L30.2 25.5 Z" fill="url(#orangeGrad)" />

  <!-- Top Right AI Indicator Dot -->
  <circle cx="48" cy="14" r="3.5" fill="url(#greenGrad)" stroke="#FFFFFF" stroke-width="1" />

  <!-- Bottom Baseline -->
  <line x1="10" y1="48" x2="54" y2="48" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
</svg>
